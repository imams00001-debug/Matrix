<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyek Game Imam</title>
    <!-- Tailwind CSS for UI Layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            font-family: 'Press Start 2P', monospace;
            background-color: #0d0d11;
            color: #ffffff;
            touch-action: manipulation;
            user-select: none;
        }

        .arcade-frame {
            box-shadow: 0 0 25px rgba(255, 184, 82, 0.15), 0 0 10px rgba(33, 33, 255, 0.4);
            border: 4px solid #1a1a3a;
        }

        .neon-text-yellow {
            text-shadow: 0 0 8px rgba(255, 255, 0, 0.8);
        }

        canvas {
            image-rendering: pixelated;
            background-color: #000000;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-2 sm:p-4">

    <!-- Main Container -->
    <div class="flex flex-col items-center max-w-xl w-full">
        
        <!-- Scoreboard Header -->
        <div class="w-full flex justify-between items-center bg-gray-900 border-2 border-blue-900 rounded-t-xl px-4 py-3 text-xs sm:text-sm">
            <div class="flex flex-col gap-1">
                <span class="text-gray-400">SCORE</span>
                <span id="scoreText" class="text-yellow-400 neon-text-yellow">0000</span>
            </div>
            <div class="flex flex-col gap-1 text-right">
                <span class="text-gray-400">HIGH SCORE</span>
                <span id="highScoreText" class="text-white">0000</span>
            </div>
        </div>

        <!-- Arcade Screen Container -->
        <div class="arcade-frame relative w-full bg-black rounded-b-xl overflow-hidden flex flex-col items-center p-2 sm:p-4">
            
            <!-- Game Canvas -->
            <canvas id="gameCanvas" class="rounded border border-blue-900/50"></canvas>

            <!-- Lives & Status Footer -->
            <div class="w-full flex justify-between items-center mt-3 px-2 text-xs">
                <div id="livesContainer" class="flex gap-2 items-center"></div>
                <div id="gameStatusText" class="text-yellow-400 animate-pulse text-[10px] sm:text-xs">
                    PRESS START TO PLAY
                </div>
            </div>

            <!-- Start / Game Over Overlay Modal -->
            <div id="overlayModal" class="absolute inset-0 bg-black/85 flex flex-col items-center justify-center p-6 text-center z-10 transition-opacity duration-300">
                <h1 id="overlayTitle" class="text-2xl sm:text-3xl font-bold text-yellow-400 mb-2 neon-text-yellow">PAC-MAN</h1>
                <p id="overlaySubtitle" class="text-xs sm:text-sm text-gray-300 mb-6 leading-relaxed">
                    Eat all dots and avoid the ghosts!
                </p>
                <button id="startButton" class="px-6 py-3 bg-yellow-400 hover:bg-yellow-300 text-black font-bold text-xs sm:text-sm rounded-lg shadow-lg hover:scale-105 active:scale-95 transition-all">
                    START GAME
                </button>
            </div>
        </div>

        <!-- Mobile Touch Controls -->
        <div class="mt-4 grid grid-cols-3 gap-2 w-48 sm:hidden">
            <div></div>
            <button id="btnUp" class="bg-gray-800 border-2 border-gray-600 rounded-lg p-3 active:bg-yellow-500 text-center text-lg">▲</button>
            <div></div>
            <button id="btnLeft" class="bg-gray-800 border-2 border-gray-600 rounded-lg p-3 active:bg-yellow-500 text-center text-lg">◄</button>
            <button id="btnDown" class="bg-gray-800 border-2 border-gray-600 rounded-lg p-3 active:bg-yellow-500 text-center text-lg">▼</button>
            <button id="btnRight" class="bg-gray-800 border-2 border-gray-600 rounded-lg p-3 active:bg-yellow-500 text-center text-lg">►</button>
        </div>

        <!-- Desktop Controls Hint -->
        <div class="hidden sm:block mt-3 text-[10px] text-gray-500 text-center">
            Use Arrow Keys or WASD to control Pac-Man
        </div>
    </div>

    <script src="Pacman.js">
    </script>
</body>
</html>
